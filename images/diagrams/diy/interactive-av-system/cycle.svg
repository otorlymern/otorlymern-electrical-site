<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="825" viewBox="0 0 1100 825" role="img" aria-labelledby="title"><title id="title">Hunt interactive A/V processor: functional reading map</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1100" height="825" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="550.0" y="35" text-anchor="middle" font-size="24" font-weight="bold">Hunt interactive A/V processor: functional reading map</text><rect x="40" y="85" width="320" height="95" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="200.0" y="126.5" text-anchor="middle" font-size="18" font-weight="bold">Audio generating system</text><text x="200.0" y="150.5" text-anchor="middle" font-size="18">independent performance</text><rect x="740" y="85" width="320" height="95" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="900.0" y="126.5" text-anchor="middle" font-size="18" font-weight="bold">Video generating system</text><text x="900.0" y="150.5" text-anchor="middle" font-size="18">independent performance</text><rect x="300" y="255" width="500" height="90" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="550.0" y="294.0" text-anchor="middle" font-size="18" font-weight="bold">Select / scale monitored parameters</text><text x="550.0" y="318.0" text-anchor="middle" font-size="18">adaptive filters, sampling or delay</text><path d="M200 180 V220 H400 V255" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><path d="M900 180 V220 H700 V255" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><rect x="300" y="395" width="500" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="550.0" y="429.0" text-anchor="middle" font-size="18" font-weight="bold">Programmable weighting / matrixing</text><text x="550.0" y="453.0" text-anchor="middle" font-size="18">parallel pattern coding</text><path d="M550 345 V395" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><rect x="300" y="525" width="500" height="90" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="550.0" y="564.0" text-anchor="middle" font-size="18" font-weight="bold">Recirculating memory / templates</text><text x="550.0" y="588.0" text-anchor="middle" font-size="18">dynamic goals within selected limits</text><path d="M550 475 V525" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><rect x="300" y="665" width="500" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="550.0" y="699.0" text-anchor="middle" font-size="18" font-weight="bold">Decode / arithmetic</text><text x="550.0" y="723.0" text-anchor="middle" font-size="18">separate related audio + video controls</text><path d="M550 615 V665" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><path d="M300 705 H80 V200 H120 V180" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><path d="M800 705 H1020 V200 H980 V180" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><text x="550" y="800" text-anchor="middle" font-size="18">Conceptual flow only: electrical interfaces, algorithms and template contents are not supplied.</text></g></svg>