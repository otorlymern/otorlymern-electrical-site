<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title"><title id="title">Passive piezo wiring and acoustic reverb signal path</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="1100" height="650" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="550.0" y="35" text-anchor="middle" font-size="24" font-weight="bold">Passive piezo wiring and acoustic reverb signal path</text><rect x="40" y="85" width="230" height="95" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="155.0" y="126.5" text-anchor="middle" font-size="18" font-weight="bold">Piezo CERAMIC</text><text x="155.0" y="150.5" text-anchor="middle" font-size="18">center conductor → TIP</text><rect x="40" y="220" width="230" height="95" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="155.0" y="261.5" text-anchor="middle" font-size="18" font-weight="bold">Piezo BRASS</text><text x="155.0" y="285.5" text-anchor="middle" font-size="18">cable shield → SLEEVE</text><rect x="430" y="120" width="250" height="140" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="555.0" y="172.0" text-anchor="middle" font-size="18" font-weight="bold">Shielded TS cable</text><text x="555.0" y="196.0" text-anchor="middle" font-size="18">under 10 feet</text><text x="555.0" y="220.0" text-anchor="middle" font-size="18">high-impedance input</text><path d="M270 130 H430" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M270 265 H350 V220 H430" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="150" text-anchor="middle" font-size="18">No pickup power supply</text><text x="850" y="180" text-anchor="middle" font-size="18">is required.</text><text x="550" y="350" text-anchor="middle" font-size="20" font-weight="bold">Acoustic send / return: separate electrical and mechanical paths</text><rect x="25" y="390" width="155" height="90" rx="6" fill="#f4f1e5" stroke="#333" stroke-width="2"/><text x="102.5" y="429.0" text-anchor="middle" font-size="18" font-weight="bold">Mixer</text><text x="102.5" y="453.0" text-anchor="middle" font-size="18">SEND</text><rect x="225" y="390" width="155" height="90" rx="6" fill="#f4f1e5" stroke="#333" stroke-width="2"/><text x="302.5" y="429.0" text-anchor="middle" font-size="18" font-weight="bold">Speaker</text><text x="302.5" y="453.0" text-anchor="middle" font-size="18">AMPLIFIER</text><rect x="425" y="390" width="155" height="90" rx="6" fill="#f4f1e5" stroke="#333" stroke-width="2"/><text x="502.5" y="441.0" text-anchor="middle" font-size="18" font-weight="bold">SPEAKER</text><rect x="625" y="390" width="155" height="90" rx="6" fill="#f4f1e5" stroke="#333" stroke-width="2"/><text x="702.5" y="429.0" text-anchor="middle" font-size="18" font-weight="bold">SPRING</text><text x="702.5" y="453.0" text-anchor="middle" font-size="18">or PLATE</text><rect x="825" y="390" width="155" height="90" rx="6" fill="#f4f1e5" stroke="#333" stroke-width="2"/><text x="902.5" y="441.0" text-anchor="middle" font-size="18" font-weight="bold">PIEZO</text><path d="M180 435 H225" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 435 H425" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 435 H625" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><path d="M780 435 H825" fill="none" stroke="#725400" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><path d="M902 480 V555 H690" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="515" width="260" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="560.0" y="549.0" text-anchor="middle" font-size="18" font-weight="bold">High-Z input / buffer</text><text x="560.0" y="573.0" text-anchor="middle" font-size="18">to mixer RETURN</text><text x="540" y="620" text-anchor="middle" font-size="18">Do not send the return back into the driving send during setup.</text></g></svg>