ight="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="315.0" y="336.0" text-anchor="middle" font-size="18" font-weight="bold">VCA 2</text><path d="M190 435 H215 V330 H250" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="290" width="160" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="530.0" y="336.0" text-anchor="middle" font-size="18" font-weight="bold">Oral mixer</text><path d="M380 330 H450" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M415 140 V310 H450" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="290" width="140" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="730.0" y="324.0" text-anchor="middle" font-size="18" font-weight="bold">Band-pass 1</text><text x="730.0" y="348.0" text-anchor="middle" font-size="18">ORAL</text><rect x="850" y="290" width="140" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="920.0" y="324.0" text-anchor="middle" font-size="18" font-weight="bold">Band-pass 2</text><text x="920.0" y="348.0" text-anchor="middle" font-size="18">ORAL</text><rect x="1040" y="290" width="140" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="1110.0" y="324.0" text-anchor="middle" font-size="18" font-weight="bold">Band-pass 3</text><text x="1110.0" y="348.0" text-anchor="middle" font-size="18">ORAL</text><path d="M610 330 H660" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 330 H850" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M990 330 H1040" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><rect x="1240" y="280" width="140" height="110" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="1310.0" y="329.0" text-anchor="middle" font-size="18" font-weight="bold">Final mixer</text><text x="1310.0" y="353.0" text-anchor="middle" font-size="18">OUT</text><path d="M1180 330 H1240" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 140 H1300 V280" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="500" width="140" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="570.0" y="546.0" text-anchor="middle" font-size="18" font-weight="bold">VCA 4</text><rect x="760" y="500" width="240" height="80" rx="6" fill="#eef3fa" stroke="#333" stroke-width="2"/><text x="880.0" y="534.0" text-anchor="middle" font-size="18" font-weight="bold">Low-pass VCF</text><text x="880.0" y="558.0" text-anchor="middle" font-size="18">FRICATIVE</text><path d="M215 435 V540 H500" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 540 H760" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 540 H1300 V390" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="630" text-anchor="middle" font-size="20">Each VCA and variable filter has an independent control input (not drawn).</text><text x="700" y="663" text-anchor="middle" font-size="20" font-weight="bold">The three oral band-pass filters are IN SERIES; no numeric formant table is supplied.</text></g></svg>