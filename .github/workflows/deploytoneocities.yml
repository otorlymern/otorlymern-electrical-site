name: Deploy to Neocities (manual)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install neocities CLI
        run: |
          gem install --user-install --no-document neocities
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> $GITHUB_PATH
      - name: Publish site
        env:
          NEOCITIES_API_KEY: ${{ 1804f4417785323becf4f7bf908b4693 }}
        run: |
          neocities push .
