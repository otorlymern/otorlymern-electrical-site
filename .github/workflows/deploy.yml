name: Deploy to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: neocities-deploy
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Strip repo-only files before deploy
        run: |
          rm -rf .git .github scripts tmp models oes-site.code-workspace .neocitiesignore
          rm -f \
            "solutions/DIY/projects/The Art Of Electronics - Horowitz & Hill.pdf" \
            "solutions/techniques/resources/Curtis_Roads_Composing_Electronic_music.pdf" \
            "solutions/techniques/resources/oram_anindividual.pdf" \
            "solutions/techniques/resources/LearnMusicWithSynths1974.pdf" \
            "solutions/DIY/projects/Music183-184.pdf"

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          cleanup: true
          neocities_supporter: true
          dist_dir: .
